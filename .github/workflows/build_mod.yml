name: Build Mod APK

on:
  workflow_dispatch:
    inputs:
      anytls_commit:
        description: 'sing-anytls-shanlian commit (shanlian anytls mod)'
        required: false
        default: '35fe946085e3cd5782fd095dd5878c7388519895'
      vt_commit:
        description: 'sing-shadowsocks2-vt commit (viewTurbo SS mod)'
        required: false
        default: '8ad5da2'
      fastup_commit:
        description: 'fastup-mod commit (FastUP trojan mod, empty = HEAD)'
        required: false
        default: '2aba39c395916633200ac72d9fe6dbf10f2b80bd'
      oppa_commit:
        description: 'oppa-mod commit (Oppa TLS tunnel mod, empty = HEAD)'
        required: false
        default: 'e1c78129290656ca4e59ccc48b0c0a7e7acddf0a'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '^1.24'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Pin external mod repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sed -i "s/^export COMMIT_ANYTLS_SHANLIAN=.*/export COMMIT_ANYTLS_SHANLIAN=\"${{ inputs.anytls_commit }}\"/" buildScript/lib/core/get_source_env.sh
          sed -i "s/^export COMMIT_SING_SS_VT=.*/export COMMIT_SING_SS_VT=\"${{ inputs.vt_commit }}\"/" buildScript/lib/core/get_source_env.sh
          sed -i "s/^export COMMIT_FASTUP_MOD=.*/export COMMIT_FASTUP_MOD=\"${{ inputs.fastup_commit }}\"/" buildScript/lib/core/get_source_env.sh
          sed -i "s/^export COMMIT_OPPA_MOD=.*/export COMMIT_OPPA_MOD=\"${{ inputs.oppa_commit }}\"/" buildScript/lib/core/get_source_env.sh
          cat buildScript/lib/core/get_source_env.sh

      - name: Build LibCore
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          go version
          ./run lib core

      - name: Build APK
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> local.properties
          ./run init action gradle
          ./gradlew assemblePreviewDebug
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          echo "APK_PATH=$APK"
          echo "APK_DIR=$(realpath $(dirname $APK))" >> $GITHUB_ENV

      - name: Verify mods are in the binary
        run: |
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          unzip -o -q "$APK" 'lib/arm64-v8a/libgojni.so' -d /tmp/apkchk
          STRINGS=$(grep -c "x365" /tmp/apkchk/lib/arm64-v8a/libgojni.so || true)
          echo "libgojni.so 'x365' hits: $STRINGS"
          if [ "$STRINGS" -eq 0 ]; then
            echo "::error::x365 protocol NOT found in libgojni.so — mods missing from build!"
            exit 1
          fi
          VT=$(grep -c "viewTurbo" /tmp/apkchk/lib/arm64-v8a/libgojni.so || true)
          echo "libgojni.so 'viewTurbo' hits: $VT"
          FU=$(grep -c "fastup" /tmp/apkchk/lib/arm64-v8a/libgojni.so || true)
          echo "libgojni.so 'fastup' hits: $FU"
          if [ "$FU" -eq 0 ]; then
            echo "::error::fastup protocol NOT found in libgojni.so — mod missing from build!"
            exit 1
          fi
          OP=$(grep -c "oppa-mod/oppa" /tmp/apkchk/lib/arm64-v8a/libgojni.so || true)
          echo "libgojni.so 'oppa-mod/oppa' hits: $OP"
          if [ "$OP" -eq 0 ]; then
            echo "::error::oppa protocol NOT found in libgojni.so — mod missing from build!"
            exit 1
          fi
          MI=$(grep -c "mihomo/1.19.25" /tmp/apkchk/lib/arm64-v8a/libgojni.so || true)
          echo "libgojni.so 'mihomo/1.19.25' spoof hits: $MI"
          if [ "$MI" -eq 0 ]; then
            echo "::error::anytls mihomo spoof NOT found in libgojni.so — shanlian patch missing!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoBox-mod-arm64
          path: app/build/outputs/apk/**/NekoBox*.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.2-mod-final
          files: app/build/outputs/apk/**/NekoBox*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
